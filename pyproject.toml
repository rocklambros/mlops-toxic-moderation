[project]
name = "mlops-toxic-moderation"
version = "0.1.0"
requires-python = ">=3.11,<3.12"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# So `scripts/` is importable by the tests that exercise it, whatever the invocation.
pythonpath = ["."]
# --strict-markers turns a typo'd mark into a collection error. Without it a mistyped
# `integration` mark is only a warning, and the test it was meant to gate runs in the unit
# job, where there is no Postgres. --strict-config does the same for a typo'd ini key, which
# otherwise silently keeps the default.
addopts = "-q --strict-markers --strict-config"
# The single declaration of record. Under --strict-markers a marker that is used and not
# declared is a COLLECTION error, so one @pytest.mark.perf in a file nobody re-reads takes
# the whole suite down -- `make test` and `make loadtest` with it.
# tests/unit/test_test_harness.py::test_every_marker_used_in_the_tree_is_declared is what
# catches a fifth marker appearing later.
markers = [
    "unit: no external services; applied automatically to tests/unit",
    "integration: needs external services, applied automatically to tests/integration (deselect with -m 'not integration')",
    "perf: measures latency against a real database, applied automatically to tests/perf (deselect with -m 'not perf')",
    "awsapply: needs a real AWS session; never runs in pull-request CI (premortem H36)",
]

# Rubric 4.1's coverage floor, on the code that decides outcomes. Branch coverage, not line:
# a policy `if` whose false arm is never taken is exactly the shape of an untested decision,
# and line coverage calls it covered.
#
# `frontend` and `rescorer` are absent from `source` on purpose. The Streamlit entry points
# are render code whose only meaningful test is the Phase 3 end-to-end traversal, and counting
# them pushes the project toward coverage theatre against a UI. `rescorer` sits behind the
# day-8 cut line, and a `source` entry for a package that was cut fails the run for the wrong
# reason.
[tool.coverage.run]
branch = true
source = ["model", "backend", "monitoring"]
omit = [
    "frontend/ui.py",
    "monitoring/dashboard.py",
    "*/__main__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
